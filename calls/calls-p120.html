<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Today's Calls · Project 120</title>
<!-- Project 120 theme. Loads the live widget (index.html) and re-skins it, so any
     future fix to the original widget shows up here automatically.
     ?look=white (default) or ?look=cream -->
<script>(function(){var c=(new URLSearchParams(location.search).get("look")||"").toLowerCase()==="cream"?"#F5F0E8":"#FFFFFF";document.write('<style>html,body{background:'+c+';margin:0}</style>');})();</script>
</head>
<body>
<script>
(function () {
  var CSS = "<style>\n/* Project 120 theme: white foundation, near-black ink, Project 120 red. */\n:root{\n  --bg:#FFFFFF; --red:#E5161E; --gold:#E5161E; --gold-hi:#111111;\n  --ink:#111111; --ink-2:#6B665F; --ink-3:#9A948B;\n  --line:rgba(17,17,17,.10); --card:#FAFAF8; --tint:rgba(229,22,30,.045);\n}\nhtml[data-look=\"cream\"]{ --bg:#F5F0E8; --card:#FBF8F3; --line:rgba(17,17,17,.12); }\nhtml,body{background:var(--bg)}\nbody{background:var(--bg)}\n.mark{display:flex;justify-content:center;align-items:baseline;gap:.22em;margin:0 auto 10px;\n  font-family:\"Inter\",sans-serif;font-weight:800;font-size:15px;letter-spacing:-.04em;color:var(--ink)}\n.mark b{color:var(--red);font-weight:800}\n.rule{height:2px;width:clamp(40px,7vw,64px);background:var(--red);border-radius:2px}\n.dot{background:var(--red)}\n.dot.done{background:transparent;border:1.5px solid rgba(17,17,17,.22)}\n.dot.next{box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--red)}\n.card{background:var(--card);border-color:var(--line);box-shadow:0 1px 2px rgba(17,17,17,.04)}\n.card.next{border-color:var(--red);background:var(--tint);box-shadow:0 0 0 1px var(--red) inset}\n.card.done{opacity:.5}\n.card.done .name{color:var(--ink-3)}\n.name:hover,.name:focus-visible{border-bottom-color:var(--red)}\n.tag{color:var(--red);border-color:rgba(229,22,30,.45)}\nli{color:#2A2723}\nli+li{border-top:1px solid rgba(17,17,17,.06)}\nli::before{color:var(--red)}\n.empty{border-color:rgba(17,17,17,.14)}\n</style>\n";
  var LOOKS = '<script>(function(){var l=(new URLSearchParams(location.search).get("look")||"white").toLowerCase();document.documentElement.setAttribute("data-look",l==="cream"?"cream":"white");})();<\/script>';
  fetch("index.html", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw 0; return r.text(); })
    .then(function (h) {
      h = h.replace(/<\/style>\s*<\/head>/, "</style>\n" + CSS + LOOKS + "\n</head>");
      h = h.replace(/<div class="coin">[\s\S]*?<\/div>/, '<div class="mark" aria-label="Project 120">Project <b>120</b></div>');
      document.open(); document.write(h); document.close();
    })
    .catch(function () { document.body.textContent = "Couldn\u2019t load the widget. Refresh to try again."; });
})();
</script>
</body>
</html>
