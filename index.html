  :root {
    --bg: #0A0A0A;
    --white: #FFFFFF;
    --gold: #BF9749;
    --gold-held: rgba(191, 151, 73, 0.42);
    --muted: #7C7870;
    --hair: rgba(191, 151, 73, 0.28);
    /* Brand metal ramp: bright top edge, deep body, second highlight low down. */
    --metal: linear-gradient(180deg,
      #FFF4CA 0%, #E9C776 17%, #C69C4C 36%, #7C6126 56%,
      #AA833A 72%, #E2C176 88%, #F8E7B2 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--white);
    font-family: "Inter Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(18px, 4.5vw, 48px) clamp(14px, 4vw, 48px);
    padding-top: calc(clamp(18px, 4.5vw, 48px) + env(safe-area-inset-top, 0px));
    padding-bottom: calc(clamp(18px, 4.5vw, 48px) + env(safe-area-inset-bottom, 0px));
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  main { width: 100%; max-width: 1120px; text-align: center; }

  /* Hook-card type: one line, sentence case, tight, gold on the final word. */
  h1 {
    font-size: clamp(24px, 5.4vw, 60px);
    letter-spacing: -0.069em;
    line-height: 1;
    white-space: nowrap;
  }
  h1 .accent { color: var(--gold); }
  h1 .w { opacity: 0; transition: opacity .22s ease-out; }

  .rule {
    width: clamp(56px, 11vw, 120px);
    height: 1px;
    margin: clamp(14px, 2.6vw, 26px) auto clamp(18px, 3.8vw, 40px);
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0; transition: opacity .22s ease-out;
  }

  .clock {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    column-gap: clamp(4px, 1.6vw, 24px);
  }
  .unit { position: relative; min-width: 0; opacity: 0; transition: opacity .22s ease-out; }
  .unit + .unit::before {
    content: "";
    position: absolute; left: calc(clamp(4px, 1.6vw, 24px) / -2); top: 14%; height: 58%;
    width: 1px; background: var(--hair);
  }
  .num {
    display: block;
    font-size: clamp(38px, 11.5vw, 132px);
    line-height: 1;
    letter-spacing: -0.035em;
    font-variant-numeric: tabular-nums;
    padding-right: 0.035em; /* re-centre after tight tracking */
    color: var(--white);
  }
  .unit.days .num {
    background: var(--metal);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    position: relative; z-index: 1;
  }
  /* Soft bloom behind the gold number, like the prop strokes. */
  .unit.days::after {
    content: ""; position: absolute; z-index: 0; pointer-events: none;
    left: 8%; right: 8%; top: 0; height: 72%;
    background: radial-gradient(ellipse at center, rgba(191,151,73,.16) 0%, rgba(191,151,73,0) 70%);
    filter: blur(6px);
  }
  .done .unit.days::after { display: none; }
  .lbl {
    display: block;
    margin-top: clamp(8px, 1.4vw, 14px);
    font-size: clamp(9px, 1.25vw, 14px);
    letter-spacing: 0.28em;
    padding-left: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .status {
    margin-top: clamp(16px, 3.4vw, 34px);
    font-size: clamp(14px, 2.6vw, 28px);
    letter-spacing: 0.22em;
    padding-left: 0.22em;
    background: var(--metal);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    opacity: 0;
    display: none;
  }
  /* Held-back state: same gold, dimmer. One glow pulse on the payoff. */
  .done .num, .done .unit.days .num {
    background: none; color: var(--gold-held); filter: none;
  }
  .done ~ .status { display: block; animation: land 1.4s ease-out forwards; }
  @keyframes land {
    0%   { opacity: 0; filter: drop-shadow(0 0 0 rgba(191,151,73,0)); }
    30%  { opacity: 1; filter: drop-shadow(0 0 22px rgba(191,151,73,.65)); }
    100% { opacity: 1; filter: drop-shadow(0 0 6px rgba(191,151,73,.25)); }
  }

  .ready .w, .ready .rule, .ready .unit { opacity: 1; }

  .notice {
    color: var(--muted);
    font-size: clamp(13px, 1.9vw, 17px);
    letter-spacing: -0.01em;
    line-height: 1.5;
    max-width: 44ch;
    margin: 0 auto;
  }
  .notice code { color: var(--white); font-family: inherit; }

  @media (prefers-reduced-motion: reduce) {
    .w, .rule, .unit { transition: none !important; }
    .done ~ .status { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<main id="app">
  <h1 id="title"></h1>
  <div class="rule" aria-hidden="true"></div>
  <div class="clock" id="clock" role="timer">
    <div class="unit days"><span class="num" id="d">0</span><span class="lbl">Days</span></div>
    <div class="unit"><span class="num" id="h">00</span><span class="lbl">Hours</span></div>
    <div class="unit"><span class="num" id="m">00</span><span class="lbl">Minutes</span></div>
    <div class="unit"><span class="num" id="s">00</span><span class="lbl">Seconds</span></div>
  </div>
  <p class="status" id="status">DEADLINE HIT</p>
</main>

<script>
(function () {
  var ZONES = {
    CT: "America/Chicago", ET: "America/New_York", MT: "America/Denver",
    PT: "America/Los_Angeles", AZ: "America/Phoenix", AK: "America/Anchorage",
    HI: "Pacific/Honolulu", UK: "Europe/London", CET: "Europe/Paris",
    AEST: "Australia/Sydney"
  };
  var q = new URLSearchParams(location.search);
  var app = document.getElementById("app");
  function esc(t) {
    return t.replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  var bg = (q.get("bg") || "").trim();
  if (bg.toLowerCase() === "none") document.documentElement.style.setProperty("--bg", "transparent");
  else if (/^[0-9a-f]{3}([0-9a-f]{3})?$/i.test(bg)) document.documentElement.style.setProperty("--bg", "#" + bg);

  // Title: white, with the final word in gold (hook-card rule).
  var titleText = (q.get("title") || "The Deadline").trim().replace(/\s+/g, " ");
  document.title = titleText;
  var words = titleText.split(" ");
  var titleHtml = words.map(function (w, i) {
    return '<span class="w' + (i === words.length - 1 ? ' accent' : '') + '">' + esc(w) + '</span>';
  }).join(" ");
  document.getElementById("title").innerHTML = titleHtml;

  function notice(html) {
    app.innerHTML = '<h1>' + titleHtml + '</h1><div class="rule" aria-hidden="true"></div><p class="notice">' + html + '</p>';
    reveal();
  }

  // One orchestrated entrance: opacity only, 0.22s ease-out per element.
  function reveal() {
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var items = [].slice.call(app.querySelectorAll(".w, .rule, .unit"));
    items.forEach(function (el, i) {
      if (reduce) { el.style.opacity = 1; return; }
      el.style.transitionDelay = (0.08 + i * 0.12) + "s";
    });
    requestAnimationFrame(function () { requestAnimationFrame(function () { app.classList.add("ready"); }); });
  }

  var tzRaw = (q.get("tz") || "CT").trim();
  var tz = ZONES[tzRaw.toUpperCase()] || tzRaw;
  try { new Intl.DateTimeFormat("en-US", { timeZone: tz }); }
  catch (e) {
    notice('The time zone <code>' + esc(tzRaw) + '</code> isn\u2019t recognized. Use CT, ET, MT, PT, or a full name like <code>America/Chicago</code>.');
    return;
  }
  var dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec((q.get("date") || "").trim());
  var tm = /^(\d{1,2}):(\d{2})$/.exec((q.get("time") || "00:00").trim());
  if (!dm) { notice('Add the deadline to the link, like <code>?date=2026-12-31</code>.'); return; }
  if (!tm || +tm[1] > 23 || +tm[2] > 59) { notice('Write the time in 24-hour format, like <code>&amp;time=23:59</code>.'); return; }

  var fmt = new Intl.DateTimeFormat("en-US", {
    timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit"
  });
  function offsetAt(ms) {
    var p = {};
    fmt.formatToParts(new Date(ms)).forEach(function (x) { p[x.type] = x.value; });
    return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second) - Math.floor(ms / 1000) * 1000;
  }
  var wall = Date.UTC(+dm[1], +dm[2] - 1, +dm[3], +tm[1], +tm[2], 0);
  var target = wall - offsetAt(wall);
  target = wall - offsetAt(target);

  var el = {
    d: document.getElementById("d"), h: document.getElementById("h"),
    m: document.getElementById("m"), s: document.getElementById("s"),
    clock: document.getElementById("clock")
  };
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  var timer;
  function tick() {
    var left = Math.max(0, Math.floor((target - Date.now()) / 1000));
    el.d.textContent = Math.floor(left / 86400);
    el.h.textContent = pad(Math.floor(left % 86400 / 3600));
    el.m.textContent = pad(Math.floor(left % 3600 / 60));
    el.s.textContent = pad(left % 60);
    if (left === 0) { el.clock.classList.add("done"); clearInterval(timer); }
  }
  tick();
  timer = setInterval(tick, 1000);
  reveal();
})();
</script>
</body>
</html>
